<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Chats Mulltidigitalcr</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #0b141a; color: #e9edef; height: 100vh; display: flex; overflow: hidden; }

        /* MODAL DE REGISTRO */
        #authModal {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #111b21; z-index: 1000; display: flex;
            justify-content: center; align-items: center; padding: 20px;
        }
        .auth-box {
            background: #202c33; padding: 25px; border-radius: 12px;
            width: 100%; max-width: 350px; text-align: center; box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        .auth-box h2 { color: #00a884; margin-bottom: 10px; font-size: 1.5rem; }
        .auth-box input {
            width: 100%; padding: 12px; margin: 8px 0; background: #111b21;
            border: 1px solid #2a3942; color: #fff; border-radius: 8px; outline: none; font-size: 1rem;
        }
        .btn-green {
            width: 100%; padding: 12px; background: #00a884; border: none;
            color: #111b21; font-weight: bold; font-size: 1rem; border-radius: 8px; cursor: pointer; margin-top: 10px;
        }

        /* INTERFAZ PRINCIPAL */
        .app-container { display: flex; width: 100%; height: 100vh; }
        
        /* BARRA LATERAL */
        .sidebar { width: 320px; background: #111b21; border-right: 1px solid #222d34; display: flex; flex-direction: column; }
        .sidebar-header { background: #202c33; padding: 12px; display: flex; justify-content: space-between; align-items: center; }
        .add-contact { padding: 10px; background: #111b21; display: flex; gap: 5px; border-bottom: 1px solid #222d34; }
        .add-contact input { flex: 1; padding: 8px; background: #202c33; border: none; color: #fff; border-radius: 6px; outline: none; }
        .add-contact button { padding: 8px 12px; background: #00a884; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; }

        .contact-list { flex: 1; overflow-y: auto; }
        .contact-item { padding: 12px 15px; border-bottom: 1px solid #1f2c33; cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
        .contact-item:hover, .contact-item.active { background: #2a3942; }

        /* VISTA DE CHAT */
        .chat-area { flex: 1; display: flex; flex-direction: column; background: #0b141a; }
        .chat-header { background: #202c33; padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; }
        .call-btns button { background: none; border: none; font-size: 1.3rem; cursor: pointer; margin-left: 12px; }

        .messages-box { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
        .msg { max-width: 70%; padding: 8px 12px; border-radius: 8px; font-size: 0.95rem; word-break: break-word; }
        .msg.sent { background: #005c4b; align-self: flex-end; }
        .msg.received { background: #202c33; align-self: flex-start; }

        .chat-input-bar { padding: 10px 15px; background: #202c33; display: flex; gap: 10px; align-items: center; }
        .chat-input-bar input { flex: 1; padding: 12px; background: #2a3942; border: none; border-radius: 8px; color: #fff; outline: none; }

        /* OVERLAY VIDEOLLAMADA */
        #videoModal {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.95); z-index: 2000; display: none;
            flex-direction: column; justify-content: center; align-items: center;
        }
        .video-container { display: flex; gap: 15px; flex-wrap: wrap; justify-content: center; margin-bottom: 20px; }
        video { width: 280px; height: 210px; background: #202c33; border-radius: 10px; object-fit: cover; }
        .btn-hangup { background: #ea4335; color: white; border: none; padding: 12px 30px; border-radius: 25px; font-weight: bold; cursor: pointer; }

        @media (max-width: 600px) {
            .sidebar { width: 100%; }
            .chat-area { display: none; }
            .chat-area.active { display: flex; position: absolute; width: 100%; height: 100%; z-index: 10; }
        }
    </style>
</head>
<body>

    <!-- MODAL REGISTRO -->
    <div id="authModal">
        <div class="auth-box">
            <h2>Chats Mulltidigitalcr</h2>
            <p style="color: #8696a0; font-size: 0.85rem; margin-bottom: 15px;">Ingresa tus datos para iniciar</p>
            <input type="text" id="userPhone" placeholder="Tu Número de Teléfono">
            <input type="text" id="userName" placeholder="Tu Nombre">
            <button class="btn-green" onclick="initApp()">Entrar</button>
        </div>
    </div>

    <!-- MAIN APP -->
    <div class="app-container">
        <!-- BARRA LATERAL -->
        <div class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <div>
                    <strong id="myAccountName">Mi Cuenta</strong>
                    <div id="myAccountPhone" style="font-size: 0.75rem; color: #00a884;"></div>
                </div>
            </div>
            <div class="add-contact">
                <input type="text" id="newPhone" placeholder="Teléfono del contacto">
                <button onclick="addContact()">Añadir</button>
            </div>
            <div class="contact-list" id="contactList"></div>
        </div>

        <!-- ÁREA DE CHAT -->
        <div class="chat-area" id="chatArea">
            <div class="chat-header">
                <div>
                    <button id="backBtn" style="background:none; border:none; color:#00a884; font-weight:bold; margin-right:10px; display:none;" onclick="closeChatMobile()">← Volver</button>
                    <strong id="targetName">Selecciona un chat</strong>
                    <div id="targetPhone" style="font-size: 0.75rem; color: #8696a0;"></div>
                </div>
                <div class="call-btns" id="callBtns" style="display: none;">
                    <button onclick="makeCall(false)" title="Llamada de voz">📞</button>
                    <button onclick="makeCall(true)" title="Videollamada">📹</button>
                </div>
            </div>

            <div class="messages-box" id="messagesBox"></div>

            <div class="chat-input-bar">
                <input type="text" id="msgInput" placeholder="Escribe un mensaje..." onkeypress="if(event.key==='Enter') sendMsg()">
                <button class="btn-green" style="width: auto; padding: 10px 20px;" onclick="sendMsg()">Enviar</button>
            </div>
        </div>
    </div>

    <!-- OVERLAY LLAMADAS -->
    <div id="videoModal">
        <h3 id="callStateText" style="color: white; margin-bottom: 15px;">Conectando...</h3>
        <div class="video-container">
            <video id="localVideo" autoplay muted></video>
            <video id="remoteVideo" autoplay></video>
        </div>
        <button class="btn-hangup" onclick="endCall()">Colgar</button>
    </div>

    <script>
        let peer = null;
        let activeConn = null;
        let mediaCall = null;
        let localStream = null;
        let myPhone = '';
        let currentTargetPhone = '';

        let contacts = JSON.parse(localStorage.getItem('app_contacts') || '[]');

        function initApp() {
            const phone = document.getElementById('userPhone').value.replace(/\D/g,'');
            const name = document.getElementById('userName').value.trim();

            if (!phone || !name) return alert('Por favor completa todos los campos.');

            myPhone = phone;
            document.getElementById('myAccountName').textContent = name;
            document.getElementById('myAccountPhone').textContent = '+' + phone;
            document.getElementById('authModal').style.display = 'none';

            // Crear conexión PeerJS utilizando el teléfono como ID
            peer = new Peer('mdcr_' + phone, {
                config: {'iceServers': [
                    { urls: 'stun:stun.l.google.com:19302' },
                    { urls: 'stun:stun1.l.google.com:19302' }
                ]}
            });

            peer.on('open', () => renderContacts());

            // Escuchar Mensajes Entrantes
            peer.on('connection', (conn) => {
                activeConn = conn;
                conn.on('data', (data) => {
                    displayMessage(data.text, 'received', data.sender);
                });
            });

            // Escuchar Llamadas Entrantes
            peer.on('call', async (call) => {
                const accept = confirm(`Llamada entrante de +${call.peer.replace('mdcr_','')}. ¿Deseas contestar?`);
                if (!accept) return;

                mediaCall = call;
                try {
                    localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
                    document.getElementById('localVideo').srcObject = localStream;
                    document.getElementById('videoModal').style.display = 'flex';

                    call.answer(localStream);
                    call.on('stream', (stream) => {
                        document.getElementById('remoteVideo').srcObject = stream;
                    });
                } catch (e) {
                    alert('Error al acceder a los dispositivos multimedia.');
                }
            });
        }

        function addContact() {
            const input = document.getElementById('newPhone');
            const phone = input.value.replace(/\D/g,'');
            if (!phone) return;

            if (!contacts.includes(phone)) {
                contacts.push(phone);
                localStorage.setItem('app_contacts', JSON.stringify(contacts));
                renderContacts();
            }
            input.value = '';
        }

        function renderContacts() {
            const list = document.getElementById('contactList');
            list.innerHTML = '';
            contacts.forEach(phone => {
                const item = document.createElement('div');
                item.className = 'contact-item';
                item.innerHTML = `<strong>+${phone}</strong><span style="color:#00a884; font-size:0.8rem;">Chat</span>`;
                item.onclick = () => openChat(phone);
                list.appendChild(item);
            });
        }

        function openChat(phone) {
            currentTargetPhone = phone;
            document.getElementById('targetName').textContent = '+' + phone;
            document.getElementById('targetPhone').textContent = 'Chat Encriptado Directo';
            document.getElementById('callBtns').style.display = 'block';

            if (window.innerWidth <= 600) {
                document.getElementById('chatArea').classList.add('active');
                document.getElementById('backBtn').style.display = 'inline-block';
            }

            // Conectar al peer del contacto
            activeConn = peer.connect('mdcr_' + phone);
        }

        function closeChatMobile() {
            document.getElementById('chatArea').classList.remove('active');
        }

        function sendMsg() {
            const input = document.getElementById('msgInput');
            const text = input.value.trim();
            if (!text || !currentTargetPhone) return;

            const payload = { text, sender: myPhone };

            if (activeConn && activeConn.open) {
                activeConn.send(payload);
            } else {
                activeConn = peer.connect('mdcr_' + currentTargetPhone);
                setTimeout(() => { if (activeConn.open) activeConn.send(payload); }, 500);
            }

            displayMessage(text, 'sent');
            input.value = '';
        }

        function displayMessage(text, type, sender = '') {
            const box = document.getElementById('messagesBox');
            const msg = document.createElement('div');
            msg.className = `msg ${type}`;
            msg.textContent = text;
            box.appendChild(msg);
            box.scrollTop = box.scrollHeight;
        }

        /* LLAMADAS Y VIDEOLLAMADAS */
        async function makeCall(video) {
            if (!currentTargetPhone) return;
            document.getElementById('videoModal').style.display = 'flex';
            document.getElementById('callStateText').textContent = 'Llamando...';

            try {
                localStream = await navigator.mediaDevices.getUserMedia({ video: video, audio: true });
                document.getElementById('localVideo').srcObject = localStream;

                mediaCall = peer.call('mdcr_' + currentTargetPhone, localStream);
                mediaCall.on('stream', (stream) => {
                    document.getElementById('remoteVideo').srcObject = stream;
                    document.getElementById('callStateText').textContent = 'En llamada';
                });
            } catch (e) {
                alert('Ocurrió un error al activar la cámara o el micrófono.');
                endCall();
            }
        }

        function endCall() {
            if (mediaCall) mediaCall.close();
            if (localStream) localStream.getTracks().forEach(track => track.stop());
            document.getElementById('videoModal').style.display = 'none';
        }
    </script>
</body>
</html>
