<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Chats Multidigitalcr</title>

    <!-- PeerJS -->
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>

    <!-- Firebase SDKs (v10 Modular via CDN Script Tags) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, doc, setDoc, getDoc, getDocs, onSnapshot, query, where, orderBy, addDoc, deleteDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // ==========================================
        // CONFIGURACIÓN DE FIREBASE 
        // Reemplaza con tus credenciales de Firebase Console
        // ==========================================
        const firebaseConfig = {
            apiKey: "TU_API_KEY",
            authDomain: "TU_PROYECTO.firebaseapp.com",
            projectId: "TU_PROYECTO",
            storageBucket: "TU_PROYECTO.appspot.com",
            messagingSenderId: "TU_SENDER_ID",
            appId: "TU_APP_ID"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Exponer a window para usarlas en nuestro script tradicional
        window.db = db;
        window.fb = { collection, doc, setDoc, getDoc, getDocs, onSnapshot, query, where, orderBy, addDoc, deleteDoc, serverTimestamp };
    </script>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #0b141a; color: #e9edef; height: 100vh; display: flex; overflow: hidden; }

        /* MODAL REGISTRO */
        #authModal {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #111b21; z-index: 1000; display: flex;
            justify-content: center; align-items: center; padding: 20px;
        }
        .auth-box {
            background: #202c33; padding: 25px; border-radius: 12px;
            width: 100%; max-width: 380px; text-align: center; box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        .auth-box h2 { color: #00a884; margin-bottom: 8px; font-size: 1.5rem; }
        .auth-box p { color: #8696a0; font-size: 0.85rem; margin-bottom: 15px; }
        .auth-box input {
            width: 100%; padding: 12px; margin: 8px 0; background: #111b21;
            border: 1px solid #2a3942; color: #fff; border-radius: 8px; outline: none; font-size: 1rem;
        }
        .btn-green {
            width: 100%; padding: 12px; background: #00a884; border: none;
            color: #111b21; font-weight: bold; font-size: 1rem; border-radius: 8px; cursor: pointer; margin-top: 10px;
            transition: background 0.2s;
        }
        .btn-green:hover { background: #029070; }

        /* APP */
        .app-container { display: flex; width: 100%; height: 100vh; position: relative; }
        
        /* SIDEBAR */
        .sidebar { width: 340px; background: #111b21; border-right: 1px solid #222d34; display: flex; flex-direction: column; }
        .sidebar-header { background: #202c33; padding: 14px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #222d34; }
        
        /* CONTADOR DE USUARIOS GLOBAL */
        .stats-panel {
            background: #182229; padding: 10px 14px; font-size: 0.8rem; color: #00a884;
            display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #222d34;
        }

        /* AGREGAR CONTACTOS */
        .add-contact { padding: 12px; background: #111b21; display: flex; flex-direction: column; gap: 8px; border-bottom: 1px solid #222d34; }
        .add-contact-inputs { display: flex; gap: 6px; }
        .add-contact input { flex: 1; padding: 8px 10px; background: #202c33; border: 1px solid #2a3942; color: #fff; border-radius: 6px; outline: none; font-size: 0.85rem; }
        
        /* LISTA CONTACTOS */
        .contact-list { flex: 1; overflow-y: auto; }
        .contact-item { padding: 12px 15px; border-bottom: 1px solid #1f2c33; cursor: pointer; display: flex; justify-content: space-between; align-items: center; transition: background 0.2s; }
        .contact-item:hover, .contact-item.active { background: #2a3942; }
        .contact-info strong { display: block; font-size: 0.95rem; color: #e9edef; }
        .contact-info span { font-size: 0.75rem; color: #8696a0; }
        .btn-delete { background: transparent; border: none; color: #ef5350; cursor: pointer; font-size: 1rem; padding: 4px 8px; border-radius: 4px; }
        .btn-delete:hover { background: rgba(239, 83, 80, 0.1); }

        /* CHAT AREA */
        .chat-area { flex: 1; display: flex; flex-direction: column; background: #0b141a; }
        .chat-header { background: #202c33; padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; }
        .call-btns button { background: none; border: none; font-size: 1.3rem; cursor: pointer; margin-left: 12px; opacity: 0.8; transition: opacity 0.2s; }
        .call-btns button:hover { opacity: 1; }

        .messages-box { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
        .msg { max-width: 70%; padding: 8px 12px; border-radius: 8px; font-size: 0.95rem; word-break: break-word; line-height: 1.4; }
        .msg.sent { background: #005c4b; align-self: flex-end; color: #e9edef; }
        .msg.received { background: #202c33; align-self: flex-start; color: #e9edef; }

        .chat-input-bar { padding: 10px 15px; background: #202c33; display: flex; gap: 10px; align-items: center; }
        .chat-input-bar input { flex: 1; padding: 12px; background: #2a3942; border: none; border-radius: 8px; color: #fff; outline: none; }

        /* OVERLAY LLAMADAS */
        #videoModal {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9); z-index: 2000; display: none;
            flex-direction: column; justify-content: center; align-items: center;
        }
        .video-container { display: flex; gap: 15px; flex-wrap: wrap; justify-content: center; margin-bottom: 20px; }
        video { width: 300px; height: 225px; background: #202c33; border-radius: 12px; object-fit: cover; border: 2px solid #2a3942; }
        .btn-hangup { background: #ea4335; color: white; border: none; padding: 12px 30px; border-radius: 25px; font-weight: bold; cursor: pointer; transition: transform 0.2s; }
        .btn-hangup:hover { transform: scale(1.05); }

        @media (max-width: 600px) {
            .sidebar { width: 100%; }
            .chat-area { display: none; }
            .chat-area.active { display: flex; position: absolute; width: 100%; height: 100%; z-index: 10; }
        }
    </style>
</head>
<body>

    <!-- MODAL REGISTRO -->
    <div id="authModal">
        <div class="auth-box">
            <h2>Chats Multidigitalcr</h2>
            <p>Ingresa tus datos para registrarte</p>
            <input type="tel" id="userPhone" placeholder="Teléfono (Ej: 50612345678)">
            <input type="text" id="userName" placeholder="Nombre de usuario">
            <button class="btn-green" onclick="initApp()">Entrar al Chat</button>
        </div>
    </div>

    <!-- MAIN APP -->
    <div class="app-container">
        <!-- SIDEBAR -->
        <div class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <div>
                    <strong id="myAccountName">Mi Cuenta</strong>
                    <div id="myAccountPhone" style="font-size: 0.75rem; color: #00a884;"></div>
                </div>
                <button onclick="logout()" style="background:none; border:none; color:#8696a0; cursor:pointer; font-size:0.8rem;">Salir</button>
            </div>

            <!-- PANEL REGISTRADOS -->
            <div class="stats-panel">
                <span>Usuarios en la Plataforma:</span>
                <strong id="globalUsersCount">0</strong>
            </div>

            <!-- AGREGAR CONTACTO -->
            <div class="add-contact">
                <div class="add-contact-inputs">
                    <input type="text" id="newContactName" placeholder="Nombre">
                    <input type="tel" id="newContactPhone" placeholder="Teléfono">
                </div>
                <button class="btn-green" style="padding: 8px; margin-top:0;" onclick="addContact()">+ Añadir Contacto</button>
            </div>

            <!-- LISTA CONTACTOS -->
            <div class="contact-list" id="contactList"></div>
        </div>

        <!-- ÁREA DE CHAT -->
        <div class="chat-area" id="chatArea">
            <div class="chat-header">
                <div>
                    <button id="backBtn" style="background:none; border:none; color:#00a884; font-weight:bold; margin-right:10px; display:none; cursor:pointer;" onclick="closeChatMobile()">← Volver</button>
                    <strong id="targetName">Selecciona un chat</strong>
                    <div id="targetPhone" style="font-size: 0.75rem; color: #8696a0;"></div>
                </div>
                <div class="call-btns" id="callBtns" style="display: none;">
                    <button onclick="makeCall(false)" title="Llamada de voz">📞</button>
                    <button onclick="makeCall(true)" title="Videollamada">📹</button>
                </div>
            </div>

            <div class="messages-box" id="messagesBox"></div>

            <div class="chat-input-bar">
                <input type="text" id="msgInput" placeholder="Escribe un mensaje..." onkeypress="if(event.key==='Enter') sendMsg()">
                <button class="btn-green" style="width: auto; padding: 10px 20px;" onclick="sendMsg()">Enviar</button>
            </div>
        </div>
    </div>

    <!-- OVERLAY VIDEOLLAMADAS -->
    <div id="videoModal">
        <h3 id="callStateText" style="color: white; margin-bottom: 15px;">Conectando...</h3>
        <div class="video-container">
            <video id="localVideo" autoplay muted playsinline></video>
            <video id="remoteVideo" autoplay playsinline></video>
        </div>
        <button class="btn-hangup" onclick="endCall()">Colgar</button>
    </div>

    <script>
        let peer = null;
        let activeConn = null;
        let mediaCall = null;
        let localStream = null;
        let myPhone = '';
        let currentTargetPhone = '';
        let unsubscribeMessages = null;

        let contacts = JSON.parse(localStorage.getItem('app_contacts_v3') || '[]');

        window.onload = () => {
            const savedPhone = localStorage.getItem('app_my_phone');
            const savedName = localStorage.getItem('app_my_name');
            if (savedPhone && savedName) {
                document.getElementById('userPhone').value = savedPhone;
                document.getElementById('userName').value = savedName;
                initApp();
            }
        };

        async function initApp() {
            const phone = document.getElementById('userPhone').value.replace(/\D/g,'');
            const name = document.getElementById('userName').value.trim();

            if (!phone || !name) return alert('Por favor completa los campos.');

            myPhone = phone;
            localStorage.setItem('app_my_phone', phone);
            localStorage.setItem('app_my_name', name);

            document.getElementById('myAccountName').textContent = name;
            document.getElementById('myAccountPhone').textContent = '+' + phone;
            document.getElementById('authModal').style.display = 'none';

            // REGISTRAR USUARIO EN FIREBASE FIRESTORE
            if (window.db) {
                await window.fb.setDoc(window.fb.doc(window.db, "users", phone), {
                    phone: phone,
                    name: name,
                    lastSeen: window.fb.serverTimestamp()
                }, { merge: true });

                // ESCUCHAR NÚMERO DE USUARIOS EN TIEMPO REAL
                window.fb.onSnapshot(window.fb.collection(window.db, "users"), (snapshot) => {
                    document.getElementById('globalUsersCount').textContent = snapshot.size;
                });
            }

            // INICIAR PEERJS PARA LLAMADAS WEBRTC
            peer = new Peer('mdcr_' + phone, {
                config: {'iceServers': [
                    { urls: 'stun:stun.l.google.com:19302' },
                    { urls: 'stun:stun1.l.google.com:19302' }
                ]}
            });

            peer.on('open', () => renderContacts());

            peer.on('call', async (call) => {
                const callerNumber = call.peer.replace('mdcr_','');
                const accept = confirm(`Llamada entrante de +${callerNumber}. ¿Deseas contestar?`);
                if (!accept) return;

                mediaCall = call;
                try {
                    localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
                    document.getElementById('localVideo').srcObject = localStream;
                    document.getElementById('videoModal').style.display = 'flex';
                    document.getElementById('callStateText').textContent = 'En llamada';

                    call.answer(localStream);
                    call.on('stream', (stream) => {
                        document.getElementById('remoteVideo').srcObject = stream;
                    });
                } catch (e) {
                    alert('Error al activar cámara/micrófono.');
                }
            });
        }

        /* GESTIÓN DE CONTACTOS */
        async function addContact() {
            const nameInput = document.getElementById('newContactName');
            const phoneInput = document.getElementById('newContactPhone');

            let name = nameInput.value.trim();
            const phone = phoneInput.value.replace(/\D/g,'');

            if (!phone) return alert('Ingresa un número válido.');
            if (phone === myPhone) return alert('No puedes agregarte a ti mismo.');

            // Si no especificó nombre, buscar en Firebase si existe el usuario registrado
            if (!name && window.db) {
                const userDoc = await window.fb.getDoc(window.fb.doc(window.db, "users", phone));
                if (userDoc.exists()) {
                    name = userDoc.data().name;
                } else {
                    name = "Contacto +" + phone;
                }
            } else if (!name) {
                name = "Contacto +" + phone;
            }

            if (contacts.some(c => c.phone === phone)) return alert('El contacto ya existe.');

            contacts.push({ name, phone });
            saveAndRenderContacts();

            nameInput.value = '';
            phoneInput.value = '';
        }

        function deleteContact(phone, event) {
            event.stopPropagation();
            if (confirm('¿Eliminar de tu lista?')) {
                contacts = contacts.filter(c => c.phone !== phone);
                saveAndRenderContacts();
                if (currentTargetPhone === phone) {
                    document.getElementById('targetName').textContent = 'Selecciona un chat';
                    document.getElementById('targetPhone').textContent = '';
                    document.getElementById('callBtns').style.display = 'none';
                    document.getElementById('messagesBox').innerHTML = '';
                    currentTargetPhone = '';
                }
            }
        }

        function saveAndRenderContacts() {
            localStorage.setItem('app_contacts_v3', JSON.stringify(contacts));
            renderContacts();
        }

        function renderContacts() {
            const list = document.getElementById('contactList');
            list.innerHTML = '';

            if (contacts.length === 0) {
                list.innerHTML = `<div style="padding: 15px; text-align: center; color: #8696a0; font-size: 0.85rem;">Lista de contactos vacía.</div>`;
                return;
            }

            contacts.forEach(c => {
                const item = document.createElement('div');
                item.className = `contact-item ${currentTargetPhone === c.phone ? 'active' : ''}`;
                item.innerHTML = `
                    <div class="contact-info">
                        <strong>${c.name}</strong>
                        <span>+${c.phone}</span>
                    </div>
                    <button class="btn-delete" onclick="deleteContact('${c.phone}', event)" title="Eliminar">🗑️</button>
                `;
                item.onclick = () => openChat(c);
                list.appendChild(item);
            });
        }

        /* CHAT Y FIRESTORE */
        function openChat(contact) {
            currentTargetPhone = contact.phone;
            document.getElementById('targetName').textContent = contact.name;
            document.getElementById('targetPhone').textContent = '+' + contact.phone;
            document.getElementById('callBtns').style.display = 'block';

            renderContacts();

            if (window.innerWidth <= 600) {
                document.getElementById('chatArea').classList.add('active');
                document.getElementById('backBtn').style.display = 'inline-block';
            }

            // CARGAR Y ESCUCHAR MENSAJES DESDE FIRESTORE
            listenToMessages();
        }

        function getChatRoomId() {
            // ID único ordenado para ambos usuarios (ej: 5061_5062)
            return [myPhone, currentTargetPhone].sort().join('_');
        }

        function listenToMessages() {
            if (unsubscribeMessages) unsubscribeMessages();

            const roomId = getChatRoomId();
            const q = window.fb.query(
                window.fb.collection(window.db, "chats", roomId, "messages"),
                window.fb.orderBy("timestamp", "asc")
            );

            unsubscribeMessages = window.fb.onSnapshot(q, (snapshot) => {
                const box = document.getElementById('messagesBox');
                box.innerHTML = '';
                snapshot.forEach((doc) => {
                    const msgData = doc.data();
                    const type = msgData.sender === myPhone ? 'sent' : 'received';
                    displayMessage(msgData.text, type);
                });
            });
        }

        async function sendMsg() {
            const input = document.getElementById('msgInput');
            const text = input.value.trim();
            if (!text || !currentTargetPhone) return;

            const roomId = getChatRoomId();

            // Guardar en Firestore
            await window.fb.addDoc(window.fb.collection(window.db, "chats", roomId, "messages"), {
                text: text,
                sender: myPhone,
                timestamp: window.fb.serverTimestamp()
            });

            input.value = '';
        }

        function displayMessage(text, type) {
            const box = document.getElementById('messagesBox');
            const msg = document.createElement('div');
            msg.className = `msg ${type}`;
            msg.textContent = text;
            box.appendChild(msg);
            box.scrollTop = box.scrollHeight;
        }

        function closeChatMobile() {
            document.getElementById('chatArea').classList.remove('active');
        }

        /* LLAMADAS WEBRTC */
        async function makeCall(enableVideo) {
            if (!currentTargetPhone) return;
            document.getElementById('videoModal').style.display = 'flex';
            document.getElementById('callStateText').textContent = 'Llamando...';

            try {
                localStream = await navigator.mediaDevices.getUserMedia({ video: enableVideo, audio: true });
                document.getElementById('localVideo').srcObject = localStream;

                mediaCall = peer.call('mdcr_' + currentTargetPhone, localStream);
                mediaCall.on('stream', (stream) => {
                    document.getElementById('remoteVideo').srcObject = stream;
                    document.getElementById('callStateText').textContent = 'En llamada';
                });
            } catch (e) {
                alert('No se pudo acceder a dispositivos.');
                endCall();
            }
        }

        function endCall() {
            if (mediaCall) mediaCall.close();
            if (localStream) localStream.getTracks().forEach(track => track.stop());
            document.getElementById('videoModal').style.display = 'none';
        }

        function logout() {
            if (confirm('¿Cerrar sesión?')) {
                localStorage.removeItem('app_my_phone');
                localStorage.removeItem('app_my_name');
                location.reload();
            }
        }
    </script>
</body>
</html>
